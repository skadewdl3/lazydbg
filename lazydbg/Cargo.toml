[package]
name = "lazydbg"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
nom = "8.0.0"
num_enum = "0.7.6"
ratatui = { workspace = true }
reactatui = { path = "../crates/reactatui" }
reactatui-macros = { path = "../crates/reactatui-macros" }
reactatui-widgets = { path = "../crates/reactatui-widgets" }
lazydbg-mi = { path = "../crates/lazydbg-mi" }
lazydbg-dap = { path = "../crates/lazydbg-dap" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
arc-swap = "1.9.2"
